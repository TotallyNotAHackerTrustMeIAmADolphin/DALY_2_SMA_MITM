; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds (and `-t upload` flashes) only the device firmware.
default_envs = lilygo-t-can485

[env:lilygo-t-can485]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

upload_protocol = espota
; upload_port is derived from include/secrets.h's local_IP by this script,
; so the device's static IP doesn't have to be hardcoded (and committed)
; here too - see scripts/extract_upload_ip.py.
extra_scripts = pre:scripts/extract_upload_ip.py
upload_flags =
	--port=3232
; Never run unit tests on the device: with espota as upload_protocol, a
; plain `pio test` would OTA-flash the Unity test firmware over the live
; bridge. Tests run natively instead - see [env:native].
test_ignore = *
; Project sources only (not the framework or libraries): the Arduino core
; compiles with -w, which hides every warning - including the printf
; format check on netLog/debugLog. Making format mismatches errors gets
; past -w, so a Setting<T> (or any wrong type) passed to a %d/%f can't
; silently print garbage (varargs never apply Setting's conversion).
build_src_flags = -Werror=format -Werror=conditionally-supported

; ESP32Async's registry releases, pinned exactly. The previous unpinned
; me-no-dev git URLs resolved to ESP32Async code from early 2025 (AsyncTCP
; 3.3.2, ESPAsyncWebServer 3.6.0), whose tcp_recved() could run on an
; already-freed pcb and crashed the device with an lwIP assert (issue #11);
; fixed in AsyncTCP 3.4.x. A web-stack update is a firmware change like any
; other, so bump these deliberately.
lib_deps =
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1

; Host-side unit tests: runs every native suite under test/ (the pure
; glideslope math plus every other pure header - Daly/SMA frame parsing,
; StatusFrame/BmsEvents/RollbackConfirm/HealthLog decision logic,
; CellSmoother, SystemConfig, TelemetrySchema, CsvDecimation, TailTrim):
;   pio test -e native
; -Wall -Wextra catches real bugs on the host build (the device env compiles
; with -w via the Arduino core, see [env:lilygo-t-can485]'s build_src_flags
; comment). -Werror=unused-function turns an unregistered test function
; static-but-uncalled into a build failure, since every test_*(void) in
; test/*/test_*.cpp is now `static` (only setUp/tearDown/main stay
; non-static) - see the #72 commit. UBSan/ASan catch undefined behaviour and
; memory errors the pure headers can't otherwise be tested for (e.g. the
; float-to-int cast this ticket removed from DalyFrames::cellVoltagesPlausible).
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -Werror=unused-function
    -fsanitize=undefined,address
    -fno-sanitize-recover=all
    -I test/common

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds (and `-t upload` flashes) only the device firmware.
default_envs = lilygo-t-can485

[env:lilygo-t-can485]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

upload_protocol = espota
; upload_port is derived from include/secrets.h's local_IP by this script,
; so the device's static IP doesn't have to be hardcoded (and committed)
; here too - see scripts/extract_upload_ip.py.
extra_scripts = pre:scripts/extract_upload_ip.py
upload_flags =
	--port=3232
; Never run unit tests on the device: with espota as upload_protocol, a
; plain `pio test` would OTA-flash the Unity test firmware over the live
; bridge. Tests run natively instead - see [env:native].
test_ignore = *

lib_deps =
    jandrassy/TelnetStream@^1.3.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/AsyncTCP.git

; Host-side unit tests for the pure glideslope math (include/Glideslope.h):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
